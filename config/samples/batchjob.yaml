apiVersion: apps.example.io/v1alpha1
kind: BatchJob
metadata:
  name: pi-sim
spec:
  image: busybox:1.36
  workers: 3
  walltimeSeconds: 120   # kill the whole job after 2 minutes
  maxRetries: 1
  command: ["sh", "-c"]
  args:
    - |
      echo "rank ${JOB_COMPLETION_INDEX} of 3 running on ${HOSTNAME}"
      sleep 30