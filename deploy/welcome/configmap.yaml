apiVersion: v1
kind: ConfigMap
metadata:
  name: welcome-content
  namespace: welcome
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Welcome</title>
      <style>
        body { font-family: system-ui, sans-serif; display: grid; place-items: center;
               min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
        main { text-align: center; padding: 1rem; }
        h1   { font-size: 2.5rem; margin-bottom: .5rem; }
        p    { color: #94a3b8; }
      </style>
    </head>
    <body>
      <main>
        <h1>Welcome to the test service</h1>
        <p>Served by a Kubernetes pod behind an AWS Application Load Balancer.</p>
      </main>
    </body>
    </html>
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # $hostname is the pod name, so repeated requests show which replica answered.
      add_header X-Served-By $hostname always;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        try_files $uri /index.html;
      }
    }
