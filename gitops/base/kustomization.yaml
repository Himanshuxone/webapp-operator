namespace: webapp-operator-system

resources:
  - namespace.yaml
  - ../../config/crd
  - ../../config/rbac
  - ../../config/manager

patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: not-used-when-target-is-set
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false